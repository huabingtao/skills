[project]
name = "danke-strategy-skill"
version = "0.1.0"
description = "Markdown-to-WeChat formatting and publishing skill for Survivor.io strategy articles."
requires-python = ">=3.9"
dependencies = [
  "markdown>=3.5.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
